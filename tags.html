---
layout: default
title: Topics
permalink: /tags/
---
<h1>Topics</h1>
{% assign tags = site.tags | sort %}
<p class="tag-cloud">
  {% for tag in tags %}<a class="pill pill-link" href="#{{ tag[0] | slugify }}">{{ tag[0] }} <small>{{ tag[1].size }}</small></a>{% endfor %}
</p>
{% for tag in tags %}
<h2 id="{{ tag[0] | slugify }}">#{{ tag[0] }}</h2>
{% assign tag_posts = tag[1] %}
{% include post-list.html posts=tag_posts %}
{% endfor %}
